name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:product-contract
      - run: npm run build

  agent-api:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: services/agent-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: |
          $env:PYTHONPATH='.'
          uv run pytest -q tests/test_system_routes.py tests/test_public_api_contract.py tests/test_runtime_configuration.py tests/test_conversation_turn_runtime.py tests/test_weather_runtime.py

  public-release-boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: .\scripts\check-public-release.ps1
      - shell: pwsh
        run: .\scripts\check-public-language.ps1
